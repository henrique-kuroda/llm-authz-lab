services:
  postgres:
    image: postgres:17-alpine
    container_name: llm-authz-postgres
    environment:
      POSTGRES_DB: authzlab
      POSTGRES_USER: lab_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # só localhost: o banco nunca fica exposto na rede
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_owner -d authzlab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
